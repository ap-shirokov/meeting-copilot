name: Build macOS DMG
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build DMG
        run: bash scripts/build-dmg.command
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Meeting-Copilot-macOS-DMG
          path: dist/*.dmg
          if-no-files-found: error
